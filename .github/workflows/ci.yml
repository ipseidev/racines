name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U sail"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      LINKS_DOMAIN: 127.0.0.1
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: array
      # Tous les fournisseurs externes sont en mode Fake : aucun appel réseau.
      SMS_PROVIDER: fake
      ASR_PROVIDER: fake
      LLM_PROVIDER: fake

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pgsql, pdo_pgsql, redis, intl, gd, bcmath, zip, imagick
          tools: composer:v2
          coverage: none

      - name: Installer Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dépendances front
        run: npm ci

      - name: Préparer l’environnement
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      # Wayfinder écrit resources/js/routes et resources/js/actions, ignorés par
      # git : sans cette étape, tsc ne trouve pas les modules « @/routes ».
      - name: Générer les routes typées
        run: php artisan wayfinder:generate --with-form

      - name: Format, lint et types (front)
        run: |
          npm run check
          npm run types:check

      - name: Tests front
        # Vitest démarre un serveur Vite ; laravel-vite-plugin le refuse en CI.
        # La compilation de production plus bas n'a pas besoin de cette dérogation.
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: npm run test

      - name: Compiler les assets
        run: npm run build

      - name: Pint et PHPStan
        run: |
          composer lint:check
          composer types:check

      - name: Tests PHP
        run: php artisan test

      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests bout en bout
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          npx wait-on http://127.0.0.1:8000 --timeout 60000
          npx playwright test

      - name: Vulnérabilités connues
        run: |
          composer audit --no-interaction
          npm audit --audit-level=high

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
